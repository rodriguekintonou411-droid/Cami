function fiche(){const x=F(P.id);if(!S.seen.includes(x.id)){S.seen.push(x.id);S.pts+=5;[[1,"p1"],[5,"p5"],[15,"p15"]].forEach(a=>{if(S.seen.length==a[0])award(a[1])});save()}const f=S.pick.includes(x.id),ok=S.rec&&S.rec.includes(x.id),act=!S.rec?`<button class="pri" onclick="go('quiz')">🧩 Passe le test pour débloquer tes choix</button>`:ok?`<button class="pri" onclick="pk(${x.id})">${f?"Retirer de mes 3 choix":"🎯 Choisir ce métier ("+S.pick.length+"/3)"}</button>`:`<p>Ce métier ne fait pas partie de tes propositions.</p><button class="pri" onclick="go('rec')">Voir mes propositions</button>`;return `<button class="bk" onclick="go('met')">← Métiers</button>${scene(x.id,150)}<div class="fh" style="--c:${U[x.u][2]};margin-top:8px"><span class="em">${x.e}</span><h2>${x.n}</h2><p>${x.d}</p>${ok?"<p>⭐ Compatible avec ton profil</p>":""}</div><section><h3>🎬 Une journée dans la vie</h3><div class="vid">Vidéo à venir</div><p>${x.j}</p></section><section><h3>🧰 Ses outils</h3>${tags(x.o)}<h3>💪 Ses qualités</h3>${tags(x.q)}</section><section class="key"><h3>📚 Matières à ne pas négliger</h3>${tags(x.mt)}<p>Travaille-les dès maintenant au collège et au lycée.</p></section><section><h3>🎓 Où l'étudier (guide du ministère)</h3>${x.f.map(a=>`<div class="fi"><b>${a[0]}</b><small>${a[1]} · ${a[2]}</small><small>Bacs : ${a[3]} · Matières de classement : ${a[4]}</small></div>`).join("")}<small>Les places et les bourses changent chaque année : consulte toujours le guide de l'année.</small></section>${act}`}

function quiz(){if(!P.L)P={L:shuf(TQ).map(q=>[q[0],shuf(q[1])]),i:0,a:[]};const i=P.i,q=P.L[i];return `<h2>Qui suis-je ?</h2><p>Un test sur tes passions, tes motivations et ta personnalité. Réponds sincèrement : il n'y a pas de mauvaise réponse.</p><div class="pr"><i style="width:${i/P.L.length*100}%"></i></div><div class="card"><h3>${i+1}/${P.L.length} · ${q[0]}</h3>${q[1].map(o=>`<button class="op" onclick="qa('${o[1]}')">${o[0]}</button>`).join("")}</div>`}
function qa(c){P.a.push(c);if(P.a.length<P.L.length){P.i++;return render()}const SU={},SD={};let MT="";P.a.forEach(c=>{const k=c[0],v=c.slice(1);if(k=="u")SU[v]=(SU[v]||0)+1;else if(k=="d")SD[v]=(SD[v]||0)+1;else MT=v});const R=M.map(x=>{let s=(SU[x.u]||0)*1.5;for(const d of TG[x.id])s+=SD[d]||0;if(x.mt.split(", ").includes(MT))s+=2;return[x.id,s]}).sort((a,b)=>b[1]-a[1]),top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);S.rec=R.slice(0,8).map(a=>a[0]);S.prof={u:top(SU).slice(0,2).map(a=>a[0]),d:top(SD).slice(0,3).map(a=>a[0]),mt:MT};S.pick=S.pick.filter(id=>S.rec.includes(id));S.pts+=15;award("qz");save();go("rec")}
function rec(){if(!S.rec)return `<h2>Tes métiers</h2><div class="card"><p>Passe d'abord le test de profil. Il te proposera les métiers qui te correspondent, puis tu pourras choisir 3 d'entre eux.</p><button class="pri" onclick="go('quiz')">🧩 Passer le test</button></div>`;const p=S.prof;return `<button class="bk" onclick="go('moi')">← Mon passeport</button><h2>Métiers qui te correspondent</h2><section><h3>🔎 Ton profil</h3><p>Passions : ${p.u.map(u=>U[u][1]+" "+U[u][0]).join(", ")}</p><p>Ce qui te motive et te ressemble : ${p.d.map(d=>DIM[d]).join(", ")}</p><p>Matière préférée : ${p.mt}</p></section><p>Choisis jusqu'à 3 métiers parmi ces propositions (${S.pick.length}/3).</p><div class="grid">${S.rec.map((id,k)=>{const x=F(id),f=S.pick.includes(id);return `<div class="mc" style="--c:${U[x.u][2]}">${scene(id,70)}<b>${x.e} ${x.n}</b><small>${k<3?"⭐ Très compatible":"Compatible"}</small><button class="bk" onclick="go('fiche',{id:${id}})">Voir la fiche</button><button class="pri" onclick="pk(${id})">${f?"Retirer":"Choisir"}</button></div>`}).join("")}</div><button class="bk" onclick="go('quiz')">Refaire le test</button>`}
function jeux(){return `<h2>Jeux</h2>${[["newG('g1')","🕵️","Devine le métier","Trouve le métier grâce aux indices."],["newG('g2')","🔧","Outil et métier","Qui utilise cet outil ?"],["newQQ()","🧠","Quiz des métiers","10 questions tirées au hasard."],["newMem()","🃏","Mémoire","Associe chaque emoji à son métier."],["go('jeu',{k:'mis',i:Math.floor(Math.random()*MIS.length)})","🚀","Mission du jour","Choisis les bons métiers pour aider."]].map(g=>`<button class="op" onclick="${g[0]}"><span class="em">${g[1]}</span> <b>${g[2]}</b><br><small>${g[3]}</small></button>`).join("")}<p>Bonnes réponses : <b>${S.g}</b> · Points : <b>${S.pts}</b></p>`}
function newG(k){let x,t;do{x=pick(M);t=pick(x.o.split(", ").filter(o=>!M.some(y=>y.id!=x.id&&y.o.split(", ").includes(o))))}while(k=="g2"&&!t);go("jeu",{k,m:x,t,o:shuf([x,...shuf(M.filter(y=>y.id!=x.id)).slice(0,3)])})}
function ans(id){if(P.done)return;P.done=1;P.pick=id;if(id==P.m.id){S.pts+=3;S.g++;if(S.g==5)award("g5")}save();render()}
function genQ(x){const r=Math.random(),mt=x.mt.split(", "),no=shuf(M.filter(y=>y.id!=x.id)).slice(0,3),nm=[x.n,...no.map(y=>y.n)];const uo=t=>t.split(", ").filter(o=>!M.some(y=>y.id!=x.id&&y.o.split(", ").includes(o)));if(r<.25){const all=[...new Set(M.flatMap(y=>y.mt.split(", ")))],bad=shuf(all.filter(a=>!mt.includes(a))).slice(0,3),ok=pick(mt);return{q:`Quelle matière faut-il travailler pour devenir ${x.n.toLowerCase()} ?`,o:shuf([ok,...bad]),a:ok}}if(r<.5){return{q:`Dans quel univers se range « ${x.n} » ?`,o:shuf([...new Set([x.u,...shuf(Object.keys(U).filter(k=>k!=x.u)).slice(0,3)])]).map(k=>U[k][0]),a:U[x.u][0]}}const u=uo(x.o.join?x.o:x.o);if(r<.75&&u.length)return{q:`Qui utilise ${u[0]} ?`,o:shuf(nm),a:x.n};return{q:`« ${x.j.split(". ")[0]}. » Quel métier est-ce ?`,o:shuf(nm),a:x.n}}
function newQQ(){go("jeu",{k:"qq",L:shuf(M).slice(0,10).map(genQ),i:0,n:0})}
function qpick(o){if(P.r!==undefined)return;P.r=o;if(o==P.L[P.i].a){P.n++;S.pts+=2;S.g++;if(S.g==5)award("g5");save()}render()}
function qnext(){P.i++;P.r=undefined;render()}
function qqv(){if(P.i>=P.L.length)return `<h2>Bravo !</h2><div class="card"><p class="big">${P.n}/${P.L.length} bonnes réponses</p><button class="pri" onclick="newQQ()">Nouvelle partie</button> <button class="bk" onclick="go('jeux')">Retour aux jeux</button></div>`;const q=P.L[P.i];return `<button class="bk" onclick="go('jeux')">← Jeux</button><h2>Quiz des métiers</h2><div class="pr"><i style="width:${P.i/P.L.length*100}%"></i></div><div class="card"><h3>${P.i+1}/${P.L.length} · ${q.q}</h3>${q.o.map((o,k)=>`<button class="op ${P.r!==undefined?(o==q.a?"ok":o==P.r?"ko":""):""}" onclick="qpick(${k})">${o}</button>`).join("")}${P.r!==undefined?`<button class="pri" onclick="qnext()">Suivant</button>`:""}</div>`}
function newMem(){go("jeu",{k:"mem",c:shuf(shuf(M).slice(0,6).flatMap(x=>[{id:x.id,t:"e"},{id:x.id,t:"n"}])).map(c=>({...c,o:0,d:0})),s:[],mv:0})}
function flip(i){const p=P,c=p.c[i];if(c.o||c.d||p.s.length>=2)return;c.o=1;p.s.push(i);if(p.s.length==2){p.mv++;const[a,b]=p.s.map(j=>p.c[j]);if(a.id==b.id){a.d=b.d=1;p.s=[];if(p.c.every(z=>z.d)){S.pts+=8;award("mm");save()}}else setTimeout(()=>{a.o=b.o=0;p.s=[];if(P===p)render()},900)}render()}
function memv(){const w=P.c.every(z=>z.d);return `<button class="bk" onclick="go('jeux')">← Jeux</button><h2>Mémoire</h2><p>Retrouve les paires emoji + métier. Coups : <b>${P.mv}</b></p><div class="cd">${P.c.map((c,i)=>`<button class="${c.d?"d":c.o?"o":""}" onclick="flip(${i})">${c.o||c.d?(c.t=="e"?`<span class="em">${F(c.id).e}</span>`:F(c.id).n):"❔"}</button>`).join("")}</div>${w?`<p><b>Bravo ! +8 points</b></p><button class="pri" onclick="newMem()">Rejouer</button>`:""}`}
function jeu(){if(P.k=="mis")return mis();if(P.k=="mem")return memv();if(P.k=="qq")return qqv();const x=P.m,g1=P.k=="g1";return `<button class="bk" onclick="go('jeux')">← Jeux</button><h2>${g1?"Devine le métier":"Outil et métier"}</h2><div class="card">${g1?`<p>Mes outils : <b>${x.o}</b></p><p>Mes qualités : <b>${x.q}</b></p><p>Matières utiles : <b>${x.mt}</b></p>`:`<p>Quel métier utilise cet outil ?</p><h3 class="big">🔧 ${P.t}</h3>`}${P.o.map(o=>`<button class="op ${P.done?(o.id==x.id?"ok":o.id==P.pick?"ko":""):""}" onclick="ans(${o.id})">${o.e} ${o.n}</button>`).join("")}${P.done?`<p><b>${P.pick==x.id?"Bravo ! +3 points":"C'était : "+x.n}</b></p><button class="pri" onclick="newG('${P.k}')">Suivant</button>`:""}</div>`}
function mis(){const i=P.i,[t,ok,op]=MIS[i],s=P.s||[];return `<button class="bk" onclick="go('jeux')">← Jeux</button><h2>Mission du jour</h2><div class="card"><h3>${t}</h3><p>Choisis 2 métiers pour aider.</p>${shuf(op).map(id=>{const x=F(id);return `<button class="op ${P.done?(ok.includes(id)?"ok":s.includes(id)?"ko":""):s.includes(id)?"sel":""}" onclick="ms(${id})">${x.e} ${x.n}</button>`}).join("")}${P.done?`<p><b>${[...s].sort().join()==[...ok].sort().join()?"Mission réussie ! +5 points":"Presque ! Les bons métiers sont en vert."}</b></p><button class="pri" onclick="go('jeu',{k:'mis',i:(${i}+1+Math.floor(Math.random()*${MIS.length-1}))%${MIS.length}})">Mission suivante</button>`:`<button class="pri" onclick="mv()">Valider</button>`}</div>`}
function ms(id){if(P.done)return;P.s=P.s||[];const i=P.s.indexOf(id);i<0?(P.s.length<2&&P.s.push(id)):P.s.splice(i,1);render()}
function mv(){if((P.s||[]).length!=2)return toast("Choisis 2 métiers");P.done=1;if([...P.s].sort().join()==[...MIS[P.i][1]].sort().join()){S.pts+=5;save()}render()}
function vf(){if(!P.L)P={L:shuf(VF).slice(0,8),i:0,n:0};const i=P.i;if(i>=P.L.length)return `<h2>Bravo !</h2><div class="card"><p class="big">${P.n}/${P.L.length} idées reçues démasquées</p><button class="pri" onclick="go('vf')">Rejouer</button></div>`;const c=P.L[i];return `<h2>Vrai ou faux ?</h2><div class="pr"><i style="width:${i/P.L.length*100}%"></i></div><div class="card"><h3>« ${c[0]} »</h3>${P.r===undefined?`<div class="row"><button class="op" onclick="va(true)">Vrai</button><button class="op" onclick="va(false)">Faux</button></div>`:`<p><b>${P.r==c[1]?"Bien vu !":"Pas tout à fait."}</b> C'est ${c[1]?"vrai":"faux"}. ${c[2]}</p><button class="pri" onclick="vn()">Suivant</button>`}</div>`}
function va(b){if(P.r!==undefined)return;P.r=b;if(b==P.L[P.i][1]){S.pts+=2;P.n++;save()}render()}
function vn(){P.i++;P.r=undefined;if(P.i>=P.L.length)award("vf");render()}
function cnt(a){const c={};a.forEach(x=>{x=x.trim();if(x&&!/voir/i.test(x))c[x]=(c[x]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function moi(){const L=S.pick.map(F),mats=cnt(L.flatMap(x=>x.mt.split(", "))).slice(0,8),bacs=cnt(L.flatMap(x=>x.f.flatMap(f=>f[3].split(", ")))).slice(0,6),txt=`Mon passeport Cami : ${L.map(x=>x.n).join(", ")||"à découvrir"}. Matières à travailler : ${mats.slice(0,4).map(a=>a[0]).join(", ")||"-"}.`;return `<div class="hero"><div class="cam">${S.av}</div><div><h2>Passeport de ${esc(S.name)}</h2><p>${S.lvl} · ${S.pts} points</p></div></div><section><h3>🎯 Mes 3 métiers</h3><div class="slots">${[0,1,2].map(i=>{const x=L[i];return x?`<button class="slot f" style="--c:${U[x.u][2]}" onclick="go('fiche',{id:${x.id}})"><span class="em">${x.e}</span><br><small>${x.n}</small></button>`:`<button class="slot" onclick="go('${S.rec?"rec":"quiz"}')">➕<br><small>Choisir</small></button>`}).join("")}</div>${!S.rec?`<p>Passe le test de profil : il te proposera les métiers qui te correspondent, puis tu en choisiras 3.</p><button class="pri" onclick="go('quiz')">🧩 Passer le test</button>`:L.length<3?`<p>Il te reste ${3-L.length} choix parmi tes propositions.</p><button class="pri" onclick="go('rec')">Voir mes propositions</button>`:""}</section>${L.length?`<section class="key"><h3>📚 Matières à ne pas négliger</h3><div class="tg">${mats.map(a=>`<span>${a[0]}${a[1]>1?" ×"+a[1]:""}</span>`).join("")}</div><h3>🎓 Séries de bac à viser</h3><div class="tg">${bacs.map(a=>`<span>${a[0]}</span>`).join("")}</div></section><section><h3>🏫 Filières pour préparer ton après-bac</h3>${L.map(x=>`<p><b>${x.e} ${x.n}</b></p>${x.f.map(a=>`<div class="fi">${a[0]}<small>${a[1]} · ${a[2]}</small><small>Bacs : ${a[3]} · Classement : ${a[4]}</small></div>`).join("")}`).join("")}<small>Les places et les bourses changent chaque année : consulte le guide de l'année sur apresmonbac.bj.</small></section>`:""}<section><h3>🧩 Mon profil</h3>${S.prof?`<p>Passions : ${S.prof.u.map(u=>U[u][1]+" "+U[u][0]).join(", ")}</p><p>Traits : ${S.prof.d.map(d=>DIM[d]).join(", ")}</p><button class="pri" onclick="go('rec')">Mes propositions</button> <button class="bk" onclick="go('quiz')">Refaire le test</button>`:`<p>Pas encore de test.</p><button class="pri" onclick="go('quiz')">Passer le test</button>`}</section><section><h3>🏅 Mes badges</h3>${S.bd.length?tags(S.bd.map(b=>BD[b]).join(", ")):"<p>Découvre un métier pour gagner ton premier badge.</p>"}</section><section><h3>📌 Repères pour l'après-bac</h3><ul><li>Le site officiel est apresmonbac.bj.</li><li>Le classement utilise 3 matières avec les coefficients de ta série.</li><li>Changer de filière après le classement peut faire perdre l'allocation.</li><li>Vérifie chaque année les règles dans le guide du ministère.</li></ul></section><a class="pri" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Partager sur WhatsApp</a> <button class="bk" onclick="go('par')">Espace parents</button>`}
function par(){const L=S.pick.map(F);return `<button class="bk" onclick="go('home')">← Accueil</button><h2>Parents et enseignants</h2><section><h3>Ce que l'enfant a exploré</h3><p>${S.seen.length} métiers vus · ${S.pts} points${L.length?`<br>Ses choix : ${L.map(x=>x.n).join(", ")}`:""}</p></section><section><h3>Pour en parler</h3><ul><li>Demandez : « Qu'est-ce qui t'a plu dans ce métier ? »</li><li>Écoutez avant de proposer : le choix doit tenir compte de ses aptitudes et de ses préférences.</li><li>Montrez que les métiers techniques, agricoles et numériques sont porteurs.</li><li>Rappelez les matières clés à travailler dès maintenant.</li><li>Consultez ensemble le guide d'information du ministère avant le bac.</li></ul></section><section><h3>En classe</h3><p>Le mode classe agrandit le texte pour un projecteur ou un téléphone partagé. Chaque élève peut avoir son propre compte sur l'appareil.</p><button class="pri" onclick="S.cls=S.cls?0:1;save();render()">${S.cls?"Désactiver":"Activer"} le mode classe</button> <button class="pri" onclick="go('acc')">Gérer les comptes</button></section><section><h3>Vos données</h3><p>Tout reste sur cet appareil. Aucune donnée n'est envoyée.</p></section>`}
render();
</script><script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
